<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ thống Kế hoạch Công tác CAX Chư A Thai</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: "Times New Roman", Times, serif; margin: 0; padding: 0; display: flex; height: 100vh; background: #eef2f7; overflow: hidden; }
        
        /* CỘT TRÁI - ĐIỀU KHIỂN */
        .sidebar { width: 380px; background: white; border-right: 2px solid #d1d9e6; display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
        .header { padding: 15px; background: #2c3e50; color: white; text-align: center; }
        .content { padding: 15px; overflow-y: auto; flex: 1; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 0.8rem; color: #34495e; }
        input, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 13px; }
        
        .btn-main { background: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; padding: 12px; font-size: 14px; margin-top: 10px; }
        .btn-main:hover { background: #219150; }
        .btn-reset { background: #95a5a6; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; padding: 10px; border-radius: 4px; }

        /* Bảng thống kê & Danh sách */
        #summary-area { margin-top: 20px; }
        .user-btn { text-align: left; background: #3498db; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-bottom: 5px; width: 100%; }
        .user-btn:hover { background: #2980b9; }
        .user-btn-row { display: flex; gap: 6px; margin-bottom: 5px; }
        .user-btn-edit { width: 42px; background: #e67e22; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .user-btn-edit:hover { background: #d35400; }

        /* CỘT PHẢI - XEM TRƯỚC */
        .preview-pane { width: calc(100% - 380px); overflow-y: auto; padding: 40px 20px; background: #525659; display: flex; flex-direction: column; align-items: center; }
        
        /* Định dạng A4 chuẩn */
        .a4-page {
            width: 210mm; min-height: 296mm; padding: 20mm 15mm 15mm 25mm; 
            background: white; box-sizing: border-box; line-height: 1.4; font-size: 13pt; color: black; 
            box-shadow: 0 0 20px rgba(0,0,0,0.4); margin-bottom: 25px; page-break-after: always;
        }

        .header-box { display: flex; justify-content: space-between; align-items: flex-start; text-align: center; margin-bottom: 20px; }
        .header-left { width: 45%; font-size: 12pt; }
        .header-right { width: 55%; font-size: 12pt; white-space: nowrap; }
        .line-doc { border-top: 1px solid black; width: 40%; margin: 5px auto 0; }
        .title { text-align: center; font-weight: bold; font-size: 15pt; margin: 30px 0 10px; text-transform: uppercase; }
        .content-body p { margin: 8px 0; text-align: justify; text-indent: 1.27cm; }
        .sig-section { margin-top: 50px; display: flex; justify-content: space-between; text-align: center; }
        .sig-box { width: 48%; line-height: 1.2; }
        .bold { font-weight: bold; } .italic { font-style: italic; }

        @media print {
            @page { size: A4; margin: 0; }
            body { display: block; } .sidebar { display: none !important; }
            .preview-pane { width: 100%; padding: 0; background: white; overflow: visible; }
            .a4-page { box-shadow: none; margin: 0; width: 210mm; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="header"><h3>CAX CHƯ A THAI</h3></div>
    <div class="content">
        <div class="form-group">
            <label>1. Chọn File Excel:</label>
            <input type="file" id="upload" accept=".xlsx, .xls">
        </div>
        <div class="form-group">
            <label>2. Tháng/Năm xuất:</label>
            <input type="text" id="monthYear" value="03 năm 2026">
        </div>
        <div class="form-group">
            <label>3. Cấp bậc Lãnh đạo:</label>
            <input type="text" id="bossRank" value="Trung tá">
        </div>
        <div class="form-group">
            <label>4. Tên Lãnh đạo:</label>
            <input type="text" id="bossName" value="Tống Xuân Đông">
        </div>
        <div class="form-group">
            <label>5. Chức vụ mặc định:</label>
            <input type="text" id="defaultRole" value="Cán bộ">
        </div>
        
        <button class="btn-main" onclick="window.print()">🖨️ XUẤT PDF / IN TẤT CẢ</button>
        <button class="btn-reset" onclick="location.reload()">🔄 LÀM MỚI HỆ THỐNG</button>

        <div id="summary-area" style="display:none;">
            <p style="font-weight:bold; margin-top:20px; border-bottom:1px solid #ddd; font-size: 13px;">📊 DANH SÁCH CÁN BỘ</p>
            <div id="user-list-btns"></div>
        </div>
    </div>
</div>

<div class="preview-pane" id="print-zone">
    <div id="welcome-msg" style="color: #ccc; margin-top: 150px; text-align:center;">
        <p>Vui lòng chọn file Excel để bắt đầu...</p>
    </div>
</div>

<script>
    const RANK_LIST = ["Đại tá", "Thượng tá", "Trung tá", "Thiếu tá", "Đại úy", "Thượng úy", "Trung úy", "Thiếu úy", "Thượng sĩ", "Trung sĩ", "Hạ sĩ", "Chiến sĩ"];
    let excelRows = []; 

    // Cập nhật tức thì khi thay đổi thông tin lãnh đạo, tháng hoặc chức vụ
    ['monthYear', 'bossRank', 'bossName', 'defaultRole'].forEach(id => {
        document.getElementById(id).addEventListener('input', () => { if(excelRows.length > 0) refreshDisplay(); });
    });

    document.getElementById('upload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            const workbook = XLSX.read(evt.target.result, { type: 'binary' });
            excelRows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
            refreshDisplay();
        };
        reader.readAsBinaryString(file);
    });

    function refreshDisplay() {
        const mYear = document.getElementById('monthYear').value;
        const bRank = document.getElementById('bossRank').value;
        const bName = document.getElementById('bossName').value;
        const defaultRole = (document.getElementById('defaultRole').value || 'Cán bộ').trim();
        const zone = document.getElementById('print-zone');
        const btnZone = document.getElementById('user-list-btns');
        const welcome = document.getElementById('welcome-msg');
        
        zone.innerHTML = ''; btnZone.innerHTML = '';
        if (welcome) welcome.style.display = 'none';

        const previousRoles = {};
        if (window.processedData && window.processedData.length > 0) {
            window.processedData.forEach(u => {
                const key = `${u.fullName}|${u.rank}|${u.name}`;
                previousRoles[key] = u.role || defaultRole;
            });
        }

        window.processedData = [];

        for (let i = 1; i < excelRows.length; i++) {
            const row = excelRows[i];
            if (!row || !row[0]) continue;
            
            const fullName = row[0].toString().trim();
            let rank = ""; let nameOnly = fullName;
            for (let r of RANK_LIST) { if (fullName.startsWith(r)) { rank = r; nameOnly = fullName.substring(r.length).trim(); break; } }
            if (!rank) { const s = fullName.indexOf(' '); rank = s!==-1?fullName.substring(0,s):"Đ/c"; nameOnly = s!==-1?fullName.substring(s).trim():fullName; }

            let plans = [];
            for (let j=1; j<=31; j++) {
                let loc = row[j] ? row[j].toString().trim() : "";
                // CHỈ LẤY Ô CÓ ĐỘ DÀI KÝ TỰ > 5
                if (loc && loc.length > 5) {
                    let sDay = j; let eDay = j;
                    while (eDay < 31 && row[eDay+1] && row[eDay+1].toString().trim() === loc) { eDay++; }
                    plans.push({ start: sDay, end: eDay, loc: loc });
                    j = eDay;
                }
            }

            if (plans.length > 0) {
                const currentIdx = window.processedData.length;
                const roleKey = `${fullName}|${rank}|${nameOnly}`;
                const role = previousRoles[roleKey] || defaultRole;
                window.processedData.push({ rank, name: nameOnly, fullName, plans, mYear, bRank, bName, role });

                // Tạo nút xem riêng cho từng người
                const row = document.createElement('div');
                row.className = 'user-btn-row';
                const btn = document.createElement('button');
                btn.className = 'user-btn';
                btn.innerText = `👤 ${fullName} (${plans.length})`;
                btn.onclick = () => renderSingle(currentIdx);
                const editBtn = document.createElement('button');
                editBtn.className = 'user-btn-edit';
                editBtn.innerText = '✏️';
                editBtn.title = 'Đổi chức vụ';
                editBtn.onclick = (e) => { e.stopPropagation(); changeUserRole(currentIdx); };
                row.appendChild(btn);
                row.appendChild(editBtn);
                btnZone.appendChild(row);

                // Hiển thị tất cả mặc định
                plans.forEach(p => zone.appendChild(createPage(rank, nameOnly, p.start, p.end, p.loc, mYear, bRank, bName, role)));
            }
        }
        document.getElementById('summary-area').style.display = 'block';
    }

    function isLocation(v) { return !['NL','A','TB','+','H','*','X','P','-','OFF'].includes(v.toUpperCase()); }

    function changeUserRole(idx) {
        const u = window.processedData[idx];
        if (!u) return;
        const newRole = prompt('Nhập chức vụ mới cho cán bộ:', u.role || 'Cán bộ');
        if (newRole === null) return;
        u.role = newRole.trim() || (u.role || 'Cán bộ');
        refreshDisplay();
    }

    function renderSingle(idx) {
        const zone = document.getElementById('print-zone'); zone.innerHTML = '';
        const u = window.currentData ? window.currentData[idx] : window.processedData[idx];
        u.plans.forEach(p => zone.appendChild(createPage(u.rank, u.name, p.start, p.end, p.loc, u.mYear, u.bRank, u.bName, u.role)));
        zone.scrollTop = 0;
    }

    function createPage(rank, name, start, end, loc, mYear, bRank, bName, role) {
        let sDay = start-1 <= 0 ? 1 : start-1;
        const d1 = `ngày ${String(sDay).padStart(2,'0')} tháng ${mYear}`, d2 = `ngày ${String(start).padStart(2,'0')} tháng ${mYear}`, d3 = `ngày ${String(end).padStart(2,'0')} tháng ${mYear}`;
        const div = document.createElement('div'); div.className = 'a4-page';
        div.innerHTML = `<div class="header-box"><div class="header-left">CÔNG AN TỈNH GIA LAI<br><span class="bold">CÔNG AN XÃ CHƯ A THAI</span><div class="line-doc"></div></div>
            <div class="header-right"><span class="bold">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</span><br><span class="bold">Độc lập – Tự do – Hạnh phúc</span><div class="line-doc" style="width:160px"></div><div style="margin-top:8px;"></div><span class="italic">Chư A Thai, ${d1}</span></div></div>
            <div class="title">KẾ HOẠCH CÔNG TÁC</div><div style="text-align:center;margin-bottom:20px;"><span class="italic">Kính gửi:</span> Trưởng Công an xã Chư A Thai.</div>
            <div class="content-body"><p>Tôi tên: <span class="bold">${name}</span></p><p>Cấp bậc: ${rank} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Chức vụ: ${role || 'Cán bộ'}</p><p>Đơn vị: Công an xã Chư A Thai, tỉnh Gia Lai</p><p>Thời gian công tác:</p>
            <p style="text-indent:2cm;">- Từ ${d2} đến ${d3}.</p><p style="text-indent:2cm;">Địa điểm công tác: <span class="bold">${loc}, tỉnh Gia Lai</span>.</p><p style="text-indent:2cm;">Phương tiện: xe mô tô cá nhân.</p><p style="text-indent:2cm;">Nội dung chính công tác: Xác minh.</p><p style="text-indent:2cm;">Thành phần tham gia: </p><p>Sau chuyến công tác báo cáo kết quả, đề xuất hướng xử lý, giải quyết với Chỉ huy Công an xã.</p></div>
            <div class="sig-section"><div class="sig-box"><p class="bold">NGƯỜI LẬP KẾ HOẠCH</p><div style="margin-top:75px;" class="bold">${rank} ${name}</div></div>
            <div class="sig-box"><p class="bold">KT. TRƯỞNG CÔNG AN XÃ<br>PHÓ TRƯỞNG CÔNG AN XÃ</p><div style="margin-top:58px;" class="bold">${bRank} ${bName}</div></div></div>`;
        return div;
    }
</script>
</body>
</html>
